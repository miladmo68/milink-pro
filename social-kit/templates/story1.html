<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Bod;src:url(../assets/fonts/bodoni-moda-latin-opsz-normal.woff2)}
@font-face{font-family:BodI;src:url(../assets/fonts/bodoni-moda-latin-opsz-italic.woff2)}
@font-face{font-family:DM;src:url(dm-sans-latin.woff2);font-weight:300 800}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:linear-gradient(170deg,#f6efe4 0%,#efe2cf 55%,#e3cfb0 100%);font-family:DM;color:#2a1d14;position:relative}
.top{position:absolute;top:250px;left:0;right:0;text-align:center}
.k{font-size:30px;letter-spacing:8px;font-weight:600;color:#9a7444}
h1{font-family:Bod;font-weight:400;font-size:118px;line-height:1;margin-top:28px;letter-spacing:-2px}
h1 i{font-family:BodI;color:#9a7444}
.card{position:absolute;left:50%;top:640px;width:640px;height:900px;margin-left:-320px;border-radius:44px;overflow:hidden;box-shadow:0 50px 100px rgba(80,50,20,.35);border:10px solid #fff;transform:rotate(-3deg);background:#000}
.card img{width:100%;height:100%;object-fit:cover;object-position:50% 38%}
.badge{position:absolute;right:120px;top:600px;width:190px;height:190px;border-radius:50%;background:#2a1d14;color:#f3d48c;display:grid;place-items:center;text-align:center;font-weight:700;font-size:28px;line-height:1.15;transform:rotate(10deg);box-shadow:0 20px 40px rgba(0,0,0,.25)}
.bottom{position:absolute;bottom:250px;left:0;right:0;text-align:center}
.cta{display:inline-block;background:#2a1d14;color:#fff;font-weight:700;font-size:38px;padding:26px 56px;border-radius:999px}
.by{margin-top:26px;font-size:28px;letter-spacing:3px;color:#7a5b3a;font-weight:600}
</style></head><body>
<div class="top"><div class="k">NEW CLIENT WORK</div><h1>Zarsa <i>Gold</i></h1></div>
<div class="card"><img src="zarsa-shot.jpg"></div>
<div class="badge">Watch<br>the reel ▶</div>
<div class="bottom"><div class="cta">See it on our profile</div><div class="by">WEBSITE BY MILINK · TORONTO</div></div>
</body></html>
