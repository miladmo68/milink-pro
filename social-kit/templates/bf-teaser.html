<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Syne;src:url(syne-latin.woff2) format("woff2");font-weight:400 800}
@font-face{font-family:DM;src:url(dm-sans-latin.woff2) format("woff2");font-weight:300 800}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#000;position:relative;font-family:DM;color:#fff}
.glow{position:absolute;width:1100px;height:1100px;left:-10px;top:330px;border-radius:50%;background:radial-gradient(circle,rgba(0,98,255,.55),rgba(0,98,255,.12) 40%,transparent 68%);filter:blur(10px)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(circle at 50% 60%,#000 20%,transparent 70%)}
.top{position:absolute;top:64px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center}
.top img{height:64px}
.pill{border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:12px 26px;font-weight:600;font-size:24px;letter-spacing:3px}
.big{position:absolute;left:60px;top:200px;font-family:Syne;font-weight:800;line-height:.86;letter-spacing:-4px}
.big .l1{font-size:168px;color:transparent;-webkit-text-stroke:2.5px rgba(255,255,255,.9)}
.big .l2{font-size:168px;background:linear-gradient(180deg,#fff 0%,#9cc8ff 55%,#0062ff 100%);-webkit-background-clip:text;color:transparent}
.browser{position:absolute;left:150px;top:690px;width:780px;height:470px;border-radius:26px;background:linear-gradient(160deg,#121a2e,#05080f);border:1.5px solid rgba(140,196,255,.35);box-shadow:0 40px 120px rgba(0,98,255,.45),0 0 0 10px rgba(255,255,255,.03);transform:perspective(1400px) rotateX(14deg) rotateZ(-4deg)}
.bar{height:54px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.08)}
.bar i{width:14px;height:14px;border-radius:50%;background:#2b3550}
.url{margin-left:18px;flex:1;height:30px;border-radius:9px;background:rgba(255,255,255,.06);font-size:18px;color:#8cc4ff;display:flex;align-items:center;padding-left:16px}
.content{padding:40px 44px}
.content .k{font-size:22px;letter-spacing:4px;color:#8cc4ff;font-weight:700}
.content .h{font-family:Syne;font-weight:800;font-size:64px;line-height:1;margin-top:16px}
.content .h b{color:#4da8ff}
.tag{position:absolute;right:46px;bottom:-30px;background:#0062ff;color:#fff;font-family:Syne;font-weight:800;font-size:44px;padding:20px 34px;border-radius:20px;transform:rotate(6deg);box-shadow:0 20px 50px rgba(0,98,255,.6)}
.foot{position:absolute;bottom:58px;left:72px;right:72px;display:flex;justify-content:space-between;font-weight:600;font-size:26px;color:rgba(255,255,255,.75)}
.foot b{color:#fff}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="top"><img src="Logo-Blue.png"><div class="pill">NOV 27 · TORONTO</div></div>
<div class="big"><div class="l1">BLACK</div><div class="l2">FRIDAY</div></div>
<div class="browser"><div class="bar"><i></i><i></i><i></i><div class="url">milink.ca</div></div>
<div class="content"><div class="k">WEBSITE DEALS · GTA BUSINESSES</div><div class="h">Your new website,<br><b>for less.</b></div></div>
<div class="tag">Coming soon</div></div>
<div class="foot"><span>Turn on notifications 🔔</span><b>@milink.ca</b></div>
</body></html>
