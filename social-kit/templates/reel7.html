<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Syne;src:url(syne-latin.woff2);font-weight:400 800}
@font-face{font-family:DM;src:url(dm-sans-latin.woff2);font-weight:300 800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#060c18;font-family:DM;color:#fff}
#bg{position:absolute;inset:0;background:radial-gradient(900px 800px at 85% 5%,rgba(0,96,255,.5),transparent 60%),radial-gradient(800px 700px at 0% 100%,rgba(0,96,255,.3),transparent 60%),#060c18}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:60px 60px}
#hook{position:absolute;left:80px;right:80px;top:250px;font-family:Syne;font-weight:800;font-size:104px;line-height:1.0;letter-spacing:-2px}
#hook b{color:#3f8bff}
#lab{position:absolute;left:80px;right:80px;top:250px}
#lab .n{font-family:Syne;font-weight:800;font-size:150px;color:#3f8bff;line-height:1}
#lab .t{font-family:Syne;font-weight:800;font-size:72px;letter-spacing:-1px;margin-top:6px}
#lab .r{font-size:36px;color:#9fb3d9;margin-top:8px;font-weight:600;letter-spacing:1px}
.laptop{position:absolute;left:60px;top:880px;width:840px;filter:drop-shadow(0 50px 70px rgba(0,0,0,.6))}
.scr{background:#0b0d12;border-radius:26px 26px 6px 6px;padding:16px 16px 22px;border:2px solid #2b3040}
.lv{overflow:hidden;border-radius:8px;background:#fff;height:505px;position:relative}
.lv img{position:absolute;left:0;top:0;width:100%}
.base{height:26px;margin:0 -60px;background:linear-gradient(180deg,#d9dde6,#9aa1b2);border-radius:0 0 30px 30px}
.phone{position:absolute;left:720px;top:960px;width:300px;height:620px;border-radius:58px;background:#0b0d12;padding:13px;border:2px solid #343a4c;filter:drop-shadow(0 50px 60px rgba(0,0,0,.6))}
.pv{border-radius:46px;overflow:hidden;width:100%;height:100%;background:#fff;position:relative}
.pv img{position:absolute;left:0;top:0;width:100%}
.isl{position:absolute;top:24px;left:50%;width:100px;height:30px;margin-left:-50px;background:#000;border-radius:20px;z-index:3}
#prog{position:absolute;left:80px;right:80px;top:1690px;display:flex;gap:12px}
#prog i{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.18)}
#prog i.on{background:#3f8bff}
#foot{position:absolute;left:80px;right:80px;top:1740px;display:flex;justify-content:space-between;font-size:28px;letter-spacing:4px;color:#7d8fb3;font-weight:700}
#out{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;opacity:0;background:#060c18}
#out img{width:480px}
#out h2{font-family:Syne;font-weight:800;font-size:96px;text-align:center;line-height:1.02;letter-spacing:-2px}
#out h2 b{color:#3f8bff}
#out .c{background:#0060FF;font-weight:800;font-size:44px;padding:30px 60px;border-radius:999px;box-shadow:0 20px 60px rgba(0,96,255,.55)}
#out p{font-size:36px;color:#9fb3d9;font-weight:600;letter-spacing:2px}
</style></head><body>
<div id="bg"></div><div id="grid"></div>
<div id="hook"></div>
<div id="lab"><div class="n"></div><div class="t"></div><div class="r"></div></div>
<div class="laptop" id="lap"><div class="scr"><div class="lv"><img id="li"></div></div><div class="base"></div></div>
<div class="phone" id="ph"><div class="isl"></div><div class="pv"><img id="pi"></div></div>
<div id="prog"></div>
<div id="foot"><span>MILINK.CA</span><span>TORONTO · GTA</span></div>
<div id="out"><img src="Logo-White.png"><h2>Your business<br>could be <b>#8.</b></h2><div class="c">DM us “START”</div><p>WEB DESIGN · TORONTO &amp; GTA</p></div>
<script>
const V=new URLSearchParams(location.search).get('v')||'a';
const HOOK={a:'7 websites.<br>7 GTA businesses.<br><b>15 seconds.</b>',b:'Pick one for<br>your business.<br><b>1 to 7 👇</b>'}[V];
const S=[['fair-construction','Fair Construction','Construction · GTA'],['kind-steps','Kind Steps','Therapy services · GTA'],['zarsa-gold','Zarsa Gold','Jewelry e-commerce'],['intershine','Intershine','Cleaning services'],['sky-contracting','Sky Contracting','Renovation · GTA'],['tarahan-choob','Tarahan Choob','Cabinetry & interiors'],['peg-studio','PEG Studio','Custom furniture']];
const $=id=>document.getElementById(id);
$('hook').innerHTML=HOOK;
$('prog').innerHTML=S.map(()=>'<i></i>').join('');
const imgs={};let loaded=0;
S.forEach(([k])=>['desktop','mobile'].forEach(t=>{const im=new Image();im.src=`${k}-${t}.jpg`;imgs[k+t]=im;}));
const ez=x=>1-Math.pow(1-x,3);
const T0=1.6, SEG=1.85, END=T0+SEG*7; // 14.55
let cur=-1;
window.setT=t=>{
 const hookOn=t<T0;
 $('hook').style.opacity=hookOn?1:0;
 $('lab').style.opacity=hookOn?0:1;
 let i=hookOn?0:Math.min(6,Math.floor((t-T0)/SEG));
 const lt=hookOn?0:(t-T0-i*SEG)/SEG; // 0..1
 if(i!==cur){cur=i;const k=S[i][0];$('li').src=imgs[k+'desktop'].src;$('pi').src=imgs[k+'mobile'].src;
  $('lab').querySelector('.n').textContent='0'+(i+1);$('lab').querySelector('.t').textContent=S[i][1];$('lab').querySelector('.r').textContent=S[i][2];
  [...$('prog').children].forEach((e,j)=>e.className=j<=i?'on':'');}
 // entry punch
 const e=hookOn?Math.min(1,t/0.5):Math.min(1,lt*SEG/0.28);
 const s=0.86+0.14*ez(e), dy=(1-ez(e))*120;
 $('lap').style.transform=`translateY(${dy}px) scale(${s}) rotate(${(1-ez(e))*-3}deg)`;
 $('ph').style.transform=`translateY(${dy*1.4}px) scale(${s}) rotate(${4-(1-ez(e))*6}deg)`;
 $('lab').style.transform=`translateY(${(1-ez(e))*40}px)`;
 // scroll
 const k=S[i][0];const dI=imgs[k+'desktop'],mI=imgs[k+'mobile'];
 const sc=hookOn?0:Math.max(0,(lt-0.15)/0.85);
 const dh=dI.naturalHeight*(808/1200)-505, mh=mI.naturalHeight*(272/390)-592;
 $('li').style.transform=`translateY(${-Math.min(dh,1400)*ez(sc)}px)`;
 $('pi').style.transform=`translateY(${-Math.min(mh,2200)*ez(sc)}px)`;
 // outro
 const o=Math.max(0,Math.min(1,(t-END)/0.3));$('out').style.opacity=o;
 $('out').querySelector('h2').style.transform=`scale(${0.92+0.08*ez(o)})`;
};
window.ready=()=>Object.values(imgs).every(i=>i.complete&&i.naturalHeight);
setT(0);
</script></body></html>
