<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Brico;src:url(bricolage-grotesque-latin.woff2) format('woff2');font-weight:200 800}
@font-face{font-family:DM;src:url(dm-sans-latin.woff2) format('woff2');font-weight:100 1000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:DM;position:relative;background:#0B1020;color:#fff}
.half{position:absolute;left:0;right:0;height:960px;overflow:hidden}
.top{top:0;background:#F2EEE7}
.top:after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(14,18,32,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(14,18,32,.05) 1px,transparent 1px);background-size:54px 54px}
.bot{top:960px;background:radial-gradient(900px 600px at 85% 40%,rgba(229,40,60,.3),transparent 60%),#0B1020}
.browser{position:absolute;left:90px;width:900px;border-radius:24px;overflow:hidden;z-index:2}
.bar{height:54px;display:flex;align-items:center;gap:10px;padding:0 20px}
.bar i{width:14px;height:14px;border-radius:50%;display:block}
.url{margin-left:18px;flex:1;height:32px;border-radius:9px;font:500 19px DM;display:flex;align-items:center;padding:0 14px}
.l .bar{background:#e9e5de}.l .bar i{background:#c9c3b9}.l .url{background:#fff;color:#6b7080}
.d .bar{background:#141a2b}.d .bar i{background:#2c3550}.d .url{background:#0b1020;color:#9aa3b8}
.view{height:560px;overflow:hidden}.view img{width:100%;display:block}
.tag{position:absolute;left:90px;font:700 30px DM;letter-spacing:.16em;text-transform:uppercase;padding:14px 26px;border-radius:999px;z-index:3}
.q{position:absolute;left:0;right:0;top:850px;height:220px;display:flex;align-items:center;justify-content:center;z-index:5}
.q div{background:#fff;color:#0E1220;border-radius:30px;padding:30px 50px;font:700 56px Brico;letter-spacing:-.03em;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
</style></head><body>
<div class="half top">
  <span class="tag" style="top:170px;background:#d9d4cb;color:#4a4f5c">A · Before</span>
  <div class="browser l" style="top:260px;box-shadow:0 40px 80px -30px rgba(14,18,32,.5)"><div class="bar"><i></i><i></i><i></i><div class="url">techfahm.com</div></div><div class="view"><img src="d00.jpg"></div></div>
</div>
<div class="half bot">
  <span class="tag" style="top:150px;background:#E5283C;color:#fff">B · After</span>
  <div class="browser d" style="top:230px;box-shadow:0 40px 80px -30px rgba(0,0,0,.7)"><div class="bar"><i></i><i></i><i></i><div class="url">techfahm.com</div></div><div class="view" style="height:440px"><img src="new-desk-hero.jpg"></div></div>
</div>
<div class="q"><div style="text-align:center;line-height:1">Same company.<br><span style="color:#E5283C">Which one would you call?</span></div></div>
<img src="Logo-Blue.png" style="position:absolute;left:90px;top:70px;height:58px;z-index:4">
<div style="position:absolute;left:90px;right:90px;bottom:120px;font:600 28px DM;color:#8e97ad;display:flex;justify-content:space-between;z-index:4"></div>
</body></html>
