<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Brico;src:url(bricolage-grotesque-latin.woff2) format('woff2');font-weight:200 800}
@font-face{font-family:DM;src:url(dm-sans-latin.woff2) format('woff2');font-weight:100 1000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B1020}
body{font-family:DM;color:#fff;position:relative}
#bgL,#bgD{position:absolute;inset:0}
#bgL{background:#F2EEE7}
#bgL:after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(14,18,32,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(14,18,32,.05) 1px,transparent 1px);background-size:54px 54px}
#bgD{background:radial-gradient(900px 700px at 85% 15%,rgba(229,40,60,.28),transparent 60%),radial-gradient(900px 700px at 0% 100%,rgba(60,90,200,.2),transparent 60%),#0B1020}
.abs{position:absolute}
h1{font-family:Brico;font-weight:700;letter-spacing:-.04em;line-height:.92}
.tag{display:inline-flex;align-items:center;gap:12px;font:700 30px DM;letter-spacing:.16em;text-transform:uppercase;padding:14px 26px;border-radius:999px}
.tb{background:#d9d4cb;color:#4a4f5c}.ta{background:#E5283C;color:#fff}
.dot{width:12px;height:12px;border-radius:50%;background:currentColor}
.browser{position:absolute;border-radius:26px;overflow:hidden;box-shadow:0 60px 120px -40px rgba(0,0,0,.6),0 0 0 1px rgba(14,18,32,.12)}
.bar{height:58px;display:flex;align-items:center;gap:11px;padding:0 22px;background:#e9e5de}
.bar i{width:15px;height:15px;border-radius:50%;background:#c9c3b9;display:block}
.url{margin-left:20px;flex:1;height:34px;border-radius:10px;background:#fff;font:500 20px DM;color:#6b7080;display:flex;align-items:center;padding:0 16px}
.dk .bar{background:#141a2b}.dk .bar i{background:#2c3550}.dk .url{background:#0b1020;color:#9aa3b8}
.view{position:relative;overflow:hidden}
.view img{position:absolute;left:0;top:0;width:100%;display:block}
.phone{position:absolute;border-radius:64px;background:#07090f;padding:15px;box-shadow:0 60px 110px -40px rgba(0,0,0,.8),inset 0 0 0 2px #2a2f3d}
.scr{border-radius:50px;overflow:hidden;width:100%;height:100%;position:relative}
.scr img{position:absolute;left:0;top:0;width:100%}
.isl{position:absolute;top:28px;left:50%;transform:translateX(-50%);width:130px;height:36px;border-radius:20px;background:#000;z-index:3}
#wipe{position:absolute;top:0;bottom:0;width:26px;background:#E5283C;box-shadow:0 0 60px 20px rgba(229,40,60,.55);z-index:5}
.logo{height:64px}
</style></head><body>
<div id="bgD"></div><div id="bgL"></div>

<!-- header -->
<div class="abs" id="hdr" style="left:70px;right:70px;top:90px;display:flex;justify-content:space-between;align-items:center;z-index:10">
  <img id="lg" class="logo" src="Logo-Blue.png"><span id="lab" style="font:700 26px DM;letter-spacing:.16em;color:#5b6070">TECHFAHM.COM</span>
</div>

<!-- hook -->
<div class="abs" id="hook" style="left:70px;top:250px;z-index:6">
  <h1 style="font-size:150px;color:#0E1220">Same<br>company.</h1>
  <h1 id="hook2" style="font-size:150px;color:#E5283C;margin-top:8px">New<br>website.</h1>
</div>

<!-- tags -->
<div class="abs" id="tagB" style="left:70px;top:250px;z-index:6"><span class="tag tb"><span class="dot"></span>Before</span><div style="font:700 74px/1 Brico;letter-spacing:-.03em;color:#0E1220;margin-top:26px">WordPress template, 2023</div></div>
<div class="abs" id="tagA" style="left:70px;top:250px;z-index:6"><span class="tag ta"><span class="dot"></span>After</span><div style="font:700 74px/1 Brico;letter-spacing:-.03em;color:#fff;margin-top:26px">Custom design, hand-coded</div></div>
<div class="abs" id="tagM" style="left:70px;top:250px;z-index:6"><span class="tag ta"><span class="dot"></span>Mobile first</span><div style="font:700 74px/1 Brico;letter-spacing:-.03em;color:#fff;margin-top:26px">Built for the phone</div></div>

<!-- main browser -->
<div class="browser" id="br" style="left:70px;top:560px;width:940px;background:#fff">
  <div class="bar" id="barL"><i></i><i></i><i></i><div class="url">techfahm.com</div></div>
  <div class="view" id="vw" style="height:1100px">
    <img id="old" src="old-full.jpg">
    <div id="newwrap" style="position:absolute;inset:0;clip-path:inset(0 100% 0 0);background:#0B1020"><img id="nw" src="new-desk-full2.jpg"></div>
    <div id="wipe" style="left:-40px"></div>
  </div>
</div>

<!-- phones -->
<div class="phone" id="p1" style="left:40px;top:760px;width:330px;height:714px"><div class="isl"></div><div class="scr"><img src="mobile-menu.jpg"></div></div>
<div class="phone" id="p3" style="left:710px;top:760px;width:330px;height:714px"><div class="isl"></div><div class="scr"><img src="mobile-location.jpg"></div></div>
<div class="phone" id="p2" style="left:340px;top:640px;width:400px;height:866px;z-index:3"><div class="isl"></div><div class="scr"><img id="mfull" src="new-mob-full2.jpg"></div></div>

<!-- end -->
<div class="abs" id="end" style="inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
  <img src="Logo-White.png" style="height:120px">
  <div style="font:700 30px DM;letter-spacing:.2em;color:#E5283C;margin-top:60px">NOW LIVE</div>
  <h1 style="font-size:118px;margin-top:20px">techfahm.com</h1>
  <div style="font:500 40px/1.4 DM;color:#aab2c6;margin-top:40px">Designed &amp; built by Milink</div>
  <div style="margin-top:90px;background:#E5283C;border-radius:999px;padding:30px 54px;font:700 44px DM">Your site next? DM “CHECK”</div>
  <div style="font:700 40px DM;color:#fff;margin-top:40px">milink.ca</div>
</div>

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const seg=(t,a,b)=>cl((t-a)/(b-a));
function op(el,v){el.style.opacity=v}
function setT(t){
  // backgrounds
  const toDark=ease(seg(t,5.0,6.4));
  op($('bgL'),1-toDark);
  $('lg').src=toDark>.5?'Logo-White.png':'Logo-Blue.png';
  $('lab').style.color=toDark>.5?'#8e97ad':'#5b6070';
  // hook 0-2.4
  const hin=eo(seg(t,0,.5)), hout=seg(t,1.85,2.3);
  op($('hook'),hin*(1-hout)); $('hook').style.transform=`translateY(${(1-hin)*60-hout*40}px)`;
  const h2=eo(seg(t,.7,1.2)); op($('hook2'),h2); $('hook2').style.transform=`translateX(${(1-h2)*-80}px)`;
  // browser
  const bin=eo(seg(t,.3,1.1));
  const bout=ease(seg(t,10.1,10.8));
  op($('br'),bin*(1-bout));
  $('br').style.transform=`translateY(${(1-bin)*240+bout*200}px) scale(${1-bout*.08})`;
  $('br').style.top=(t<2.4?1000:560)+'px';
  if(t<2.5){ $('br').style.top=(1080-ease(seg(t,1.95,2.5))*520)+'px'; }
  else $('br').style.top='560px';
  // old scroll 2.4-5
  const oldMax=1970*(940/1524)-1100; // displayed old height
  $('old').style.transform=`translateY(${-ease(seg(t,2.6,4.8))*oldMax}px)`;
  // wipe 5.0-6.2
  const w=ease(seg(t,5.0,6.2));
  $('newwrap').style.clipPath=`inset(0 ${(1-w)*100}% 0 0)`;
  $('wipe').style.left=(w*940-13)+'px'; op($('wipe'),w>0&&w<1?1:0);
  $('barL').style.background=w>.5?'#141a2b':'#e9e5de';
  $('br').classList.toggle('dk',w>.5);
  // new scroll 6.4-10
  const newH=11495*(940/1440);
  $('nw').style.transform=`translateY(${-ease(seg(t,6.6,10.0))*(newH*.62)}px)`;
  // tags
  const tb=seg(t,2.45,2.8)*(1-seg(t,4.8,5.1)); op($('tagB'),tb); $('tagB').style.transform=`translateY(${(1-eo(seg(t,2.4,2.8)))*40}px)`;
  const ta=seg(t,6.0,6.4)*(1-seg(t,9.9,10.2)); op($('tagA'),ta); $('tagA').style.transform=`translateY(${(1-eo(seg(t,6,6.4)))*40}px)`;
  const tm=seg(t,10.6,11.0)*(1-seg(t,13.4,13.7)); op($('tagM'),tm); $('tagM').style.transform=`translateY(${(1-eo(seg(t,10.6,11)))*40}px)`;
  // phones 10.4-13.6
  const pin=eo(seg(t,10.4,11.2)), pout=ease(seg(t,13.3,13.8));
  op($('p2'),pin*(1-pout)); $('p2').style.transform=`translateY(${(1-pin)*500+pout*-100}px)`;
  const s1=eo(seg(t,10.7,11.5));
  op($('p1'),s1*(1-pout)); $('p1').style.transform=`translate(${(1-s1)*-300}px,${(1-s1)*200}px) rotate(${-6*s1}deg)`;
  op($('p3'),s1*(1-pout)); $('p3').style.transform=`translate(${(1-s1)*300}px,${(1-s1)*200}px) rotate(${6*s1}deg)`;
  const mH=22176*(370/780);
  $('mfull').style.transform=`translateY(${-ease(seg(t,11.2,13.3))*mH*.33}px)`;
  // end 13.7-16
  const e=eo(seg(t,13.7,14.4)); op($('end'),e); $('end').style.transform=`scale(${.94+.06*e})`;
  op($('hdr'),1-e);
}
window.setT=setT; setT(0);
</script>
</body></html>
